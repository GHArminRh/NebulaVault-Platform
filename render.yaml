services:
  - type: web
    name: nebula-vault
    runtime: python
    plan: free
    buildCommand: bash build.sh
    # Restore the required Django Site (SITE_ID=1) before serving requests.
    # This is idempotent and repairs the primary Site row if it was deleted.
    startCommand: python manage.py migrate --noinput && python manage.py createcachetable django_cache --database default && python manage.py bootstrap_render_admin && python manage.py shell -c "from django.contrib.sites.models import Site; Site.objects.update_or_create(pk=1, defaults={'domain': 'mydigigi.ir', 'name': 'Nebula Vault'})" && python manage.py bootstrap_cms_homepage && gunicorn config.wsgi:application --bind 0.0.0.0:$PORT --workers 1 --timeout 120
    healthCheckPath: /healthz/
    envVars:
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DJANGO_DEBUG
        value: "False"
      - key: DJANGO_ALLOWED_HOSTS
        value: "mydigigi.ir,www.mydigigi.ir,.onrender.com"
      - key: CSRF_TRUSTED_ORIGINS
        value: "https://mydigigi.ir,https://www.mydigigi.ir,https://*.onrender.com"
      - key: DATABASE_URL
        fromDatabase:
          name: nebula-vault-db
          property: connectionString
      - key: ZARINPAL_ENABLED
        value: "False"
      - key: ZARINPAL_SANDBOX
        value: "True"

databases:
  - name: nebula-vault-db
    plan: free
    databaseName: nebula_vault
    user: nebula_vault_user
