services:
  - type: web
    name: nebula-vault
    runtime: python
    plan: free
    # Keep code commits deploying automatically. Blueprint Auto Sync should be
    # disabled separately when avoiding a second deploy for render.yaml changes.
    autoDeployTrigger: commit
    buildCommand: bash build.sh
    # bootstrap_render_admin also repairs the required Django Site (SITE_ID=1).
    # Keep startup initialization in one place; do not repeat the Site update here.
    startCommand: python manage.py migrate --noinput && python manage.py createcachetable django_cache --database default && python manage.py bootstrap_render_admin && gunicorn config.wsgi:application --bind 0.0.0.0:$PORT --workers 1 --timeout 120
    healthCheckPath: /healthz/
    envVars:
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DJANGO_DEBUG
        value: "False"
      - key: DJANGO_ALLOWED_HOSTS
        value: "mydigigi.ir,www.mydigigi.ir,nebula-vault-oesn.onrender.com"
      - key: CSRF_TRUSTED_ORIGINS
        value: "https://mydigigi.ir,https://www.mydigigi.ir,https://nebula-vault-oesn.onrender.com"
      - key: DATABASE_URL
        fromDatabase:
          name: nebula-vault-db
          property: connectionString
      - key: ZARINPAL_ENABLED
        value: "False"
      - key: ZARINPAL_SANDBOX
        value: "True"

databases:
  - name: nebula-vault-db
    plan: free
    databaseName: nebula_vault
    user: nebula_vault_user
