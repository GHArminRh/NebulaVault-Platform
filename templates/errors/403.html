<!DOCTYPE html>
<html lang="fa" dir="rtl">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="robots" content="noindex, nofollow">
    <title>403 | دسترسی غیرمجاز — Nebula Vault</title>
    <style>
    :root { color-scheme: dark; --bg:#080d18; --panel:#101a2b; --line:#263750; --muted:#a7b5ca; --text:#f4f7fb; --accent:#78aaff; }
    * { box-sizing:border-box; }
    body { margin:0; min-height:100vh; display:grid; place-items:center; padding:24px; font-family:Tahoma,Arial,sans-serif; color:var(--text); background:radial-gradient(ellipse at 50% 0%,#162b49 0%,var(--bg) 62%); }
    main { width:min(100%,560px); text-align:center; padding:clamp(28px,6vw,52px); border:1px solid var(--line); border-radius:24px; background:linear-gradient(145deg,rgba(18,30,49,.98),rgba(10,17,30,.98)); box-shadow:0 24px 80px #0008; }
    .brand { display:inline-flex; align-items:center; gap:10px; color:#d9e7ff; font-size:13px; letter-spacing:.12em; direction:ltr; }
    .logo { width:34px; height:34px; display:grid; place-items:center; border:1px solid #4a6b9a; border-radius:11px; color:var(--accent); font-weight:800; }
    .code { margin:34px 0 12px; color:var(--accent); font-size:clamp(64px,14vw,92px); line-height:1; font-weight:800; letter-spacing:-.06em; }
    h1 { margin:0 0 14px; font-size:clamp(21px,4vw,27px); }
    p { margin:0 auto; max-width:390px; color:var(--muted); line-height:2; font-size:14px; }
    .rule { height:1px; margin:28px 0 22px; background:linear-gradient(90deg,transparent,var(--line),transparent); }
    .hint { font-size:12px; color:#7f91aa; }
    a { display:inline-flex; align-items:center; justify-content:center; min-height:44px; margin-top:26px; padding:0 22px; border-radius:12px; color:#081326; background:#a9c9ff; font-size:14px; font-weight:700; text-decoration:none; transition:transform .15s,background .15s; }
    a:hover { transform:translateY(-1px); background:#c1d8ff; }
    @media (prefers-reduced-motion:reduce) { a { transition:none; } }
    </style>
  </head>
  <body>
    <main>
      <div class="brand"><span class="logo">N</span><span>NEBULA VAULT</span></div>
      <div class="code">403</div>
      <h1>دسترسی غیرمجاز</h1>
      <p>شما اجازهٔ دسترسی به این بخش را ندارید. این API فقط برای مدیران فعال سامانه در دسترس است.</p>
      <div class="rule"></div>
      <p class="hint">اگر به دسترسی مدیریتی نیاز دارید، با مدیر سامانه تماس بگیرید.</p>
      <a href="/">بازگشت به صفحهٔ اصلی</a>
    </main>
  </body>
</html>
