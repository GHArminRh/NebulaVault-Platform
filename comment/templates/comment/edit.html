{% extends "portal/base.html" %}{% block title %}ویرایش دیدگاه | نبیولا والت{% endblock %}{% block content %}<section class="page-wrap nv-blog-list-section"><div class="nv-comment-edit-card"><div class="eyebrow">ویرایش دیدگاه</div><h1>دیدگاه خود را اصلاح کنید.</h1><form method="post">{% csrf_token %}<textarea name="content" rows="7" maxlength="5000" required>{{ comment.content }}</textarea><label class="nv-comment-spoiler"><input type="checkbox"
