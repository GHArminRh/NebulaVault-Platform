# Separate Blueprint for Celery. It adopts the existing web service only to
# inject the dedicated broker URL; the current cache Redis remains untouched.
services:
  - type: keyvalue
    name: nebula-vault-celery-queue
    plan: 256mb
    region: oregon
    maxmemoryPolicy: noeviction
    persistenceMode: journal-snapshot
    ipAllowList: []

  - type: web
    name: nebula-vault
    runtime: python
    plan: free
    region: oregon
    branch: deploy/render-ready
    autoDeployTrigger: commit
    buildCommand: bash build.sh
    startCommand: python manage.py render_startup && exec gunicorn config.wsgi:application --bind 0.0.0.0:$PORT --workers 1 --timeout 120
    healthCheckPath: /healthz/
    envVars:
      - key: CELERY_BROKER_URL
        fromService:
          type: keyvalue
          name: nebula-vault-celery-queue
          property: connectionString

  - type: worker
    name: nebula-vault-celery-worker
    runtime: python
    plan: 0.5c-512mb
    region: oregon
    branch: deploy/render-ready
    autoDeployTrigger: commit
    buildCommand: python -m pip install --disable-pip-version-check -r requirements.txt
    startCommand: celery -A config worker --loglevel=INFO --concurrency=1 --prefetch-multiplier=1 --max-tasks-per-child=100
    maxShutdownDelaySeconds: 300
    envVars:
      - key: DJANGO_SETTINGS_MODULE
        value: config.settings
      - key: DJANGO_SECRET_KEY
        fromService:
          type: web
          name: nebula-vault
          envVarKey: DJANGO_SECRET_KEY
      - key: DATABASE_URL
        fromService:
          type: web
          name: nebula-vault
          envVarKey: DATABASE_URL
      - key: CELERY_BROKER_URL
        fromService:
          type: keyvalue
          name: nebula-vault-celery-queue
          property: connectionString
