# Optional standalone Blueprint for Wagtail scheduled publishing.
# Create this as a separate Blueprint using this file as its Blueprint path.
# Do NOT sync it as the primary web-service Blueprint.
services:
  - type: cron
    name: nebula-vault-cms-publisher
    runtime: python
    region: oregon
    plan: 0.5c-512mb
    schedule: "0 * * * *"
    buildCommand: bash build.sh
    startCommand: python manage.py publish_scheduled
    envVars:
      - key: DJANGO_SECRET_KEY
        fromService:
          name: nebula-vault
          type: web
          envVarKey: DJANGO_SECRET_KEY
      - key: DJANGO_DEBUG
        value: "False"
      - key: DJANGO_ALLOWED_HOSTS
        value: "localhost"
      - key: DATABASE_URL
        fromDatabase:
          name: nebula-vault-db
          property: connectionString
