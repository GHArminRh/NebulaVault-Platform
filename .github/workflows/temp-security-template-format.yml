name: Temporary security template formatting

on:
  pull_request:
    paths:
      - "templates/accounts/two_factor_settings.html"
      - "templates/portal/_auth_flip_card.html"
      - ".github/workflows/temp-security-template-format.yml"

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/email-two-factor-recovery-codes
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --disable-pip-version-check -r requirements-dev.txt
      - run: python scripts/check_templates.py --reformat
      - name: Commit formatted templates
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add templates/accounts/two_factor_settings.html templates/portal/_auth_flip_card.html
          if ! git diff --cached --quiet; then
            git commit -m "Format email two-factor templates"
            git push origin HEAD:refs/heads/feat/email-two-factor-recovery-codes
          fi
