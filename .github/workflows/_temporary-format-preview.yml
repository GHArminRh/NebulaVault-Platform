name: Temporary formatter preview

on:
  pull_request:
    branches:
      - deploy/render-ready

permissions:
  contents: read

jobs:
  preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm ci --no-audit --no-fund
      - name: Print formatted CSS for review
        run: npx prettier static/portal/css/account-security.css static/portal/css/admin-motion.css
