name: One-time auth CSS formatting
on:
  push:
    branches:
      - fix/mobile-auth-layout-and-auth-review
permissions:
  contents: write
jobs:
  format:
    if: github.event.head_commit.message != 'Format mobile auth CSS with Prettier'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/mobile-auth-layout-and-auth-review
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: npx prettier --write static/portal/css/auth-responsive.css
      - name: Commit formatted stylesheet
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add static/portal/css/auth-responsive.css
          git diff --cached --quiet || (git commit -m "Format mobile auth CSS with Prettier" && git push)
