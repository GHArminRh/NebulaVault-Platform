name: One-time CMS asset formatting
on:
  push:
    branches:
      - fix/complete-django-cms-integration
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify and format CMS assets
        run: |
          python -m pip install --disable-pip-version-check -r requirements-dev.txt
          python scripts/check_templates.py
          npm install --no-audit --no-fund
          npx prettier --write static/portal/css/cms-builder.css
          git diff -- static/portal/css/cms-builder.css
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add static/portal/css/cms-builder.css
          if git diff --cached --quiet; then
            echo "CMS CSS is already formatted."
            exit 0
          fi
          git commit -m "Format responsive CMS builder styles"
          git push origin HEAD:fix/complete-django-cms-integration
