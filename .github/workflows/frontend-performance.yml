name: Public frontend performance audit

on:
  push:
    branches:
      - deploy/render-ready
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: frontend-performance-${{ github.ref }}
  cancel-in-progress: true

jobs:
  wait-for-production:
    name: Wait for the latest Render deployment
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Wait until the production health endpoint responds
        run: |
          for attempt in $(seq 1 48); do
            headers="$(curl --fail --silent --show-error --dump-header - --output /dev/null https://nebula-vault-oesn.onrender.com/healthz/ || true)"
            deployed_commit="$(printf '%s\n' "$headers" | grep -i '^X-Render-Git-Commit:' | tail -n 1 | cut -d ' ' -f2 | tr -d '\r')"
            if [ "$deployed_commit" = "$GITHUB_SHA" ]; then
              echo "Production is healthy and serves the requested commit: $deployed_commit"
              exit 0
            fi
            echo "Waiting for Render commit $GITHUB_SHA (attempt ${attempt}/48; currently serving ${deployed_commit:-unknown})."
            sleep 15
          done
          echo "Render did not serve the requested commit within 12 minutes."
          exit 1

  lighthouse:
    name: Lighthouse mobile and desktop
    needs: wait-for-production
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        device: [mobile, desktop]
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Audit production pages with Lighthouse
        uses: treosh/lighthouse-ci-action@v12
        with:
          urls: |
            https://nebula-vault-oesn.onrender.com/
            https://nebula-vault-oesn.onrender.com/products/
            https://nebula-vault-oesn.onrender.com/pricing/
            https://nebula-vault-oesn.onrender.com/accounts/login/
            https://nebula-vault-oesn.onrender.com/blog/
          runs: 3
          configPath: ${{ matrix.device == 'desktop' && './.lighthouserc.desktop.json' || './.lighthouserc.json' }}
          uploadArtifacts: true
