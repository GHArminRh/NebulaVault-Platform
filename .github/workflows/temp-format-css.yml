name: Temporary CSS formatter
on:
  push:
    branches:
      - chore/temporarily-disable-social-login-clean-admin
permissions:
  contents: read
jobs:
  format-css:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci --no-audit --no-fund
      - name: Print Prettier-formatted stylesheet
        run: npx prettier static/portal/css/auth-turnstile.css
