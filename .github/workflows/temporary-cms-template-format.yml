name: Temporary CMS template formatter

on:
  push:
    branches:
      - feat/standardize-django-cms

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install template formatter
        run: pip install -r requirements-dev.txt
      - name: Format CMS homepage template
        run: python scripts/check_templates.py --reformat
      - name: Commit formatting if needed
        run: |
          if git diff --quiet -- templates/portal/cms_home_page.html; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add templates/portal/cms_home_page.html
          git commit -m "Format CMS homepage template"
          git push
