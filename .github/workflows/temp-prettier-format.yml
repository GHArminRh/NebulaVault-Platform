name: Temporary CSS formatting probe

on:
  pull_request:
    paths:
      - "static/portal/css/account-security.css"
      - ".github/workflows/temp-prettier-format.yml"

permissions:
  contents: read

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci --no-audit --no-fund
      - run: npx prettier --write static/portal/css/account-security.css
      - name: Print formatted stylesheet
        run: |
          echo "FORMATTED_CSS_BEGIN"
          cat static/portal/css/account-security.css
          echo "FORMATTED_CSS_END"
