name: Temporary dashboard template formatter

on:
  push:
    branches:
      - refactor/template-markup-readability
    paths:
      - .github/workflows/temp-format-dashboard.yml

permissions:
  contents: write

jobs:
  format-dashboard:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install the repository formatter
        run: python -m pip install djlint==1.47.1

      - name: Format the dashboard template
        run: djlint --reformat --profile=django --indent=2 --warn --quiet templates/portal/dashboard.html

      - name: Commit formatted template
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add templates/portal/dashboard.html
          if ! git diff --cached --quiet; then
            git commit -m "style(templates): apply djlint to dashboard markup"
            git push origin HEAD:refactor/template-markup-readability
          fi
