name: Temporary project migration generation

on:
  push:
    branches:
      - feat/standardize-django-cms

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install project dependencies
        run: python -m pip install --upgrade pip && pip install -r requirements.txt
      - name: Generate missing project migrations
        env:
          DJANGO_SECRET_KEY: ci-only-not-for-production
          DJANGO_DEBUG: "True"
          DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1
        run: python manage.py makemigrations --noinput
      - name: Commit generated migration files
        run: |
          find . -path '*/migrations/*.py' -not -name '__init__.py' -print0 | xargs -0 -r git add
          if git diff --cached --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Commit generated Django app migrations"
          git push
