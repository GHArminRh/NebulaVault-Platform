name: Public frontend browser tests

on:
  pull_request:
    branches:
      - deploy/render-ready
    paths:
      - "templates/**"
      - "static/**"
      - "accounts/templates/**"
      - "accounts/static/**"
      - "blog/templates/**"
      - "comment/templates/**"
      - "portal/**"
      - "accounts/**"
      - "blog/**"
      - "comment/**"
      - "config/**"
      - "tests/e2e/**"
      - "playwright.config.js"
      - "package.json"
      - "package-lock.json"
      - "requirements.txt"
      - ".github/workflows/frontend-browser-tests.yml"
  push:
    branches:
      - deploy/render-ready
    paths:
      - "templates/**"
      - "static/**"
      - "accounts/templates/**"
      - "accounts/static/**"
      - "blog/templates/**"
      - "comment/templates/**"
      - "portal/**"
      - "accounts/**"
      - "blog/**"
      - "comment/**"
      - "config/**"
      - "tests/e2e/**"
      - "playwright.config.js"
      - "package.json"
      - "package-lock.json"
      - "requirements.txt"
      - ".github/workflows/frontend-browser-tests.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: frontend-browser-tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  browser:
    name: Browser regression (Chromium + WebKit)
    runs-on: ubuntu-latest
    timeout-minutes: 35
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: nebula_e2e
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d nebula_e2e"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      CI: "true"
      DJANGO_SETTINGS_MODULE: config.test_settings
      DJANGO_SECRET_KEY: ci-only-not-for-production
      DJANGO_DEBUG: "True"
      DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1,0.0.0.0
      DB_NAME: nebula_e2e
      DB_USER: postgres
      DB_PASSWORD: postgres
      DB_HOST: 127.0.0.1
      DB_PORT: "5432"
      TURNSTILE_ENABLED: "False"
      DJANGO_EMAIL_BACKEND: django.core.mail.backends.locmem.EmailBackend
      MEDIA_STORAGE_BACKEND: local
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install Django application dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt -r requirements-dev.txt

      - name: Prepare isolated browser-test database
        run: python manage.py migrate --noinput --run-syncdb --settings=config.test_settings

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install locked browser-test dependencies
        run: npm ci --no-audit --no-fund

      - name: Print normalized browser-test formatting for CI diagnostics
        run: npx prettier tests/e2e/auth-journeys.spec.js

      - name: Install Chromium and WebKit
        run: npx playwright install --with-deps chromium webkit

      - name: Run browser regression suite
        run: npm run test:e2e

      - name: Upload Playwright diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-browser-diagnostics
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 14
