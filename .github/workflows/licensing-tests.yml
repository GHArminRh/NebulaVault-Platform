name: Licensing tests

on:
  push:
    branches: [deploy/render-ready, refactor/staff-app, feat/django-login-failed-attempt-throttle]
    paths:
      - "licensing/**"
      - "api/**"
      - "accounts/models.py"
      - "accounts/backends.py"
      - "accounts/two_factor.py"
      - "catalog/**"
      - "subscriptions/**"
      - "billing/**"
      - "staff/models.py"
      - "staff/signals.py"
      - "config/**"
      - "portal/**"
      - "comment/**"
      - "requirements.txt"
  pull_request:
    paths:
      - "licensing/**"
      - "api/**"
      - "accounts/models.py"
      - "accounts/backends.py"
      - "accounts/two_factor.py"
      - "catalog/**"
      - "subscriptions/**"
      - "billing/**"
      - "staff/models.py"
      - "staff/signals.py"
      - "comment/**"
      - "config/**"
      - "portal/**"
      - "requirements.txt"
      - "pyproject.toml"

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: nebula_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d nebula_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DJANGO_SECRET_KEY: ci-only-not-for-production
      DJANGO_DEBUG: "True"
      DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1
      DB_NAME: nebula_test
      DB_USER: postgres
      DB_PASSWORD: postgres
      DB_HOST: 127.0.0.1
      DB_PORT: "5432"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: python -m pip install --upgrade pip && pip install -r requirements.txt
      - name: Check formatting baseline
        run: |
          python -m pip install ruff
          ruff check config/settings.py config/test_settings.py portal/tests.py api billing/services.py billing/order_services.py billing/attempt_services.py billing/finalization_services.py
      - name: Check Django configuration
        run: python manage.py check --settings=config.test_settings
      - name: Check migration state for all apps
        run: python manage.py makemigrations --check --dry-run --settings=config.test_settings
      - name: Run regression tests
        run: >-
          python manage.py test
          licensing
          api
          accounts.test_turnstile
          accounts.tests
          accounts.test_email_backends
          billing.tests
          portal.tests
          --settings=config.test_settings
          --verbosity=2
