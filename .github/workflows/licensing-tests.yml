name: Licensing tests

on:
  push:
    branches: [refactor/staff-app]
    paths:
      - "licensing/**"
      - "accounts/**"
      - "catalog/**"
      - "subscriptions/**"
      - "staff/**"
      - "config/**"
      - "requirements.txt"
      - ".github/workflows/licensing-tests.yml"
  pull_request:
    paths:
      - "licensing/**"
      - "accounts/**"
      - "catalog/**"
      - "subscriptions/**"
      - "staff/**"
      - "config/**"
      - "requirements.txt"
      - ".github/workflows/licensing-tests.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: nebula_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d nebula_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DJANGO_SECRET_KEY: ci-only-not-for-production
      DJANGO_DEBUG: "True"
      DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1
      DB_NAME: nebula_test
      DB_USER: postgres
      DB_PASSWORD: postgres
      DB_HOST: 127.0.0.1
      DB_PORT: "5432"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: python -m pip install --upgrade pip && pip install -r requirements.txt
      - name: Run licensing tests
        run: python manage.py test licensing --settings=config.test_settings --verbosity=2

      - name: Run Turnstile tests
        if: always()
        run: python manage.py test accounts.test_turnstile --settings=config.test_settings --verbosity=2

      - name: Run account regression tests
        if: always()
        run: python manage.py test accounts.tests --settings=config.test_settings --verbosity=2

      - name: Run email backend tests
        run: python manage.py test accounts.test_email_backends --settings=config.test_settings --verbosity=2
