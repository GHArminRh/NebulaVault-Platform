name: One-time CMS template formatting
on:
  push:
    branches:
      - fix/complete-django-cms-integration
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Format the CMS homepage template once
        run: |
          python -m pip install djlint==1.47.1
          djlint --reformat --profile=django --indent=2 --warn --quiet templates/portal/cms_home_page.html
          git diff -- templates/portal/cms_home_page.html
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add templates/portal/cms_home_page.html
          if git diff --cached --quiet; then
            echo "Template is already formatted."
            exit 0
          fi
          git commit -m "Format django CMS homepage template"
          git push origin HEAD:fix/complete-django-cms-integration
