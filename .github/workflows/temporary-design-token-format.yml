name: Temporary frontend formatter
on:
  push:
    branches:
      - refactor/frontend-design-tokens
permissions:
  contents: write
concurrency:
  group: temporary-design-token-format
  cancel-in-progress: true
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Format the design-token browser test
        run: |
          npm ci --no-audit --no-fund
          npx prettier --write tests/e2e/public-frontend.spec.js
      - name: Commit formatted test and remove temporary workflow
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/temporary-design-token-format.yml
          git add tests/e2e/public-frontend.spec.js
          git commit -m "style(test): format design-token regression test"
          git push origin "HEAD:${GITHUB_REF_NAME}"
