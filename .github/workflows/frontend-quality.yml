name: Front-end quality checks

on:
  push:
    branches:
      - deploy/render-ready
      - maintenance/frontend-full-quality-oct-2026
  pull_request:
    branches:
      - deploy/render-ready

permissions:
  contents: read

jobs:
  frontend:
    name: Validate formatted frontend, templates, and scripts
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: frontend-quality-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install development tools
        run: |
          python -m pip install --disable-pip-version-check -r requirements-dev.txt
          npm install --no-audit --no-fund

      - name: Check CSS, JavaScript, and tooling formatting
        run: npm run check:assets

      - name: Check public Django templates
        run: npm run check:templates

      - name: Validate JavaScript syntax
        run: npm run check:js

      - name: Lint browser JavaScript
        run: npm run lint:js

      - name: Audit public templates and asset references
        run: npm run audit:source
