name: Front-end quality checks

on:
  push:
    branches:
      - deploy/render-ready
      - maintenance/frontend-full-quality-oct-2026
  pull_request:
    branches:
      - deploy/render-ready

permissions:
  contents: read

jobs:
  frontend:
    name: Check formatting and JavaScript
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install development tools
        run: |
          python -m pip install --disable-pip-version-check -r requirements-dev.txt
          npm install --no-audit --no-fund

      - name: Verify front-end formatting and JavaScript syntax
        run: npm run check:frontend
