name: One-time Prettier repair

on:
  push:
    branches:
      - fix/admin-single-loading-bar

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out PR branch
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install locked formatter
        run: npm ci --no-audit --no-fund

      - name: Format only the four reported files
        run: npx prettier --write static/portal/css/admin-motion.css static/portal/css/unified-experience.css static/portal/js/admin-motion.js static/portal/js/site.js

      - name: Commit formatting-only changes
        run: |
          if git diff --quiet; then
            echo "The four files are already formatted."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add static/portal/css/admin-motion.css static/portal/css/unified-experience.css static/portal/js/admin-motion.js static/portal/js/site.js
          git commit -m "Format reported frontend assets with Prettier"
          git push
