name: One-time Django template formatting repair

on:
  push:
    branches:
      - fix/admin-single-loading-bar

permissions:
  contents: write

jobs:
  format-templates:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out PR branch
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install template formatter
        run: python -m pip install --disable-pip-version-check -r requirements-dev.txt

      - name: Format public Django templates
        run: python scripts/check_templates.py --reformat

      - name: Commit template-formatting changes
        run: |
          if git diff --quiet; then
            echo "Public templates are already formatted."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add templates accounts/templates blog/templates comment/templates
          git commit -m "Format public Django templates with djlint"
          git push
