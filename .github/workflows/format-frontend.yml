name: Format front-end source

on:
  push:
    branches:
      - maintenance/frontend-full-quality-oct-2026
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: frontend-format-${{ github.ref }}
  cancel-in-progress: true

jobs:
  format:
    name: Format CSS, JavaScript, and front-end tooling
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out the maintenance branch
        uses: actions/checkout@v4
        with:
          ref: maintenance/frontend-full-quality-oct-2026

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install development tools
        run: npm install --no-audit --no-fund

      - name: Format front-end assets
        run: npm run format:assets

      - name: Commit formatting changes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .prettierrc.json .prettierignore package.json package-lock.json eslint.config.js playwright.config.js tests/e2e
          git add static/portal/css static/portal/js static/portal/service-worker.js accounts/static
          if git diff --cached --quiet; then
            echo "The front-end assets are already formatted."
            exit 0
          fi
          git commit -m "style(frontend): format browser source [skip ci]"
          git push origin HEAD:maintenance/frontend-full-quality-oct-2026
