name: Temporary CMS stylesheet formatter

on:
  push:
    branches:
      - feat/standardize-django-cms

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install formatter
        run: npm install --no-audit --no-fund
      - name: Format CMS stylesheet
        run: npx prettier --write static/portal/css/unified-experience.css
      - name: Commit formatting if needed
        run: |
          if git diff --quiet -- static/portal/css/unified-experience.css; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add static/portal/css/unified-experience.css
          git commit -m "Format CMS hero stylesheet"
          git push
